# Pin the project name so volume/network names stay "kiosk-server_*"
# regardless of the folder name (repo was flattened from kiosk-server/).
name: kiosk-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiosk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiosk_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kiosk_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: